
AWSTemplateFormatVersion: '2010-09-09'
Description: Plantilla principal de la infraestructura de asistencia

Parameters:
  EnvironmentName:
    Type: String
    Default: asistencia
    Description: Nombre del entorno

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/red.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/seguridad.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId

  ServerStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/servidor.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        SubnetId: !GetAtt NetworkStack.Outputs.SubnetId
        SecurityGroupId: !GetAtt SecurityStack.Outputs.SecurityGroupId

Outputs:
  VpcId:
    Description: ID de la VPC
    Value: !GetAtt NetworkStack.Outputs.VpcId

  SubnetId:
    Description: ID de la subred publica
    Value: !GetAtt NetworkStack.Outputs.SubnetId

  SecurityGroupId:
    Description: ID del grupo de seguridad
    Value: !GetAtt SecurityStack.Outputs.SecurityGroupId

  InstanceId:
    Description: ID del servidor EC2
    Value: !GetAtt ServerStack.Outputs.InstanceId
